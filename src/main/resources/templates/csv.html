<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>CSV一括登録</title>
</head>
<body>

<h1> CSV一括登録</h1>

<form th:action="@{/quiz/mc/csv}" method="post" enctype="multipart/form-data">
    <label>CSVファイルを選択：</label><br>
    <input type="file" name="file" accept=".csv"><br><br>
    <input type="submit" value="アップロード">
</form>

<p th:if="${msg}" th:text="${msg}" style="color:blue"></p>

<p><a th:href="@{/}">トップへ戻る</a></p>

</body>
</html>
